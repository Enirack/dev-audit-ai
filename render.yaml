services:
  - type: web
    name: devaudit-ai-engine
    runtime: docker
    dockerfilePath: ./ai-engine/Dockerfile
    dockerContext: ./ai-engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_ENGINE_SERVICE_NAME
        value: devaudit-ai-engine
      - key: AI_ENGINE_PROVIDER
        value: mock
      - key: AI_ENGINE_ANTHROPIC_API_KEY
        sync: false
      - key: AI_ENGINE_INTERNAL_SECRET
        sync: false

  - type: web
    name: devaudit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_PASSPHRASE
        sync: false
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: AI_ENGINE_BASE_URL
        sync: false
      - key: AI_ENGINE_INTERNAL_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ALLOW_ORIGIN
        sync: false
      - key: INGESTION_MAX_ARCHIVE_BYTES
        value: "104857600"
      - key: INGESTION_MAX_REPOSITORY_BYTES
        value: "209715200"
      - key: INGESTION_TIMEOUT_SECONDS
        value: "60"
