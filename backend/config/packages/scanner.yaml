parameters:
    scanner.ignored_directories:
        - '.git'
        - 'node_modules'
        - 'vendor'
        - 'dist'
        - 'build'
        - 'out'
        - 'coverage'
        - '.next'
        - '.nuxt'
        - '.cache'
        - '__pycache__'
        - '.venv'
        - 'venv'
        - '.idea'
        - '.vscode'
        - '.pytest_cache'
        - '.mypy_cache'
    scanner.ignored_file_patterns:
        - '*.min.js'
        - '*.min.css'
        - '*.map'
        - '*.log'
    scanner.binary_extensions:
        - 'png'
        - 'jpg'
        - 'jpeg'
        - 'gif'
        - 'ico'
        - 'pdf'
        - 'zip'
        - 'tar'
        - 'gz'
        - '7z'
        - 'exe'
        - 'dll'
        - 'so'
        - 'class'
        - 'jar'
        - 'woff'
        - 'woff2'
        - 'ttf'
        - 'eot'
        - 'mp3'
        - 'mp4'
        - 'mov'
        - 'wasm'
    scanner.max_file_size_bytes: 5242880
    scanner.max_repository_size_bytes: 209715200
    scanner.max_files: 20000
